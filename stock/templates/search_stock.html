<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Stock Search</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: url('https://plus.unsplash.com/premium_photo-1661963212517-830bbb7d76fc?q=80&w=2886&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 0;
      backdrop-filter: blur(8px);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 600px;
      background: rgba(0, 0, 0, 0.6);
      padding: 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(15px);
      color: #fff;
    }

    h2 {
      margin-bottom: 1.5rem;
      text-align: center;
      font-weight: 600;
      font-size: 1.8rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 999px;
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
      box-shadow: 0 0 0 1px #555;
      transition: box-shadow 0.3s ease, background-color 0.3s ease;
    }

    input[type="text"]::placeholder {
      color: #ccc;
    }

    input[type="text"]:focus {
      outline: none;
      background-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 2px #007aff;
    }

    ul#suggestions {
      list-style-type: none;
      padding: 0;
      margin-top: 1rem;
      border-radius: 1rem;
      overflow: hidden;
      background-color: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      transition: 0.3s ease;
    }

    ul#suggestions li {
      padding: 0.8rem 1rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
      color: #fff;
    }

    ul#suggestions li:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 480px) {
      .container {
        padding: 1.5rem;
      }

      h2 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <h2>Search for Stocks</h2>
    <input type="text" id="stockSearch" placeholder="Type a stock symbol or name...">
    <ul id="suggestions"></ul>
  </div>

  <script>
    const searchInput = document.getElementById('stockSearch');
    const suggestionsList = document.getElementById('suggestions');

    searchInput.addEventListener('input', function () {
      const query = this.value;

      if (query.length < 1) {
        suggestionsList.innerHTML = '';
        return;
      }

      fetch(`/stock/search/${query}/`)
        .then(response => response.json())
        .then(data => {
          suggestionsList.innerHTML = '';
          if (Array.isArray(data)) {
            data.forEach(item => {
              const li = document.createElement('li');
              li.textContent = `${item.symbol} - ${item.shortname}`;
              li.onclick = () => window.location.href = `/stock/stockdet/${item.symbol}`;
              suggestionsList.appendChild(li);
            });
          }
        })
        .catch(error => {
          console.error('Error fetching data:', error);
        });
    });
  </script>
</body>
</html>
