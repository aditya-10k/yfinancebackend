<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
</head>
<body>
     <form method=POST action="{% url 'search' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Symbol:</label>
            {{ form.symbol }}
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
  
</body>
</html>
