<!DOCTYPE html>
<html>
<head>
    <title>Live Stock Search</title>
    <style>
        input[type="text"] {
            width: 300px;
            padding: 8px;
            font-size: 16px;
        }

        ul#suggestions {
            list-style-type: none;
            padding: 0;
            margin-top: 5px;
            width: 300px;
            border: 1px solid #ccc;
            background-color: #fff;
        }

        ul#suggestions li {
            padding: 8px;
            cursor: pointer;
        }

        ul#suggestions li:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h2>Search for Stocks</h2>
    <input type="text" id="stockSearch" placeholder="Type a stock symbol or name...">
    <ul id="suggestions"></ul>

    <script>
        const searchInput = document.getElementById('stockSearch');
        const suggestionsList = document.getElementById('suggestions');

        searchInput.addEventListener('input', function () {
            const query = this.value;

            if (query.length < 1) {
                suggestionsList.innerHTML = '';
                return;
            }

            fetch(`/stock/search/${query}/`)
                .then(response => response.json())
                .then(data => {
                    suggestionsList.innerHTML = '';
                    if (Array.isArray(data)) {
                        data.forEach(item => {
                            const li = document.createElement('li');
                            li.textContent = `${item.symbol} - ${item.shortname}`;
                            li.onclick = () => window.location.href = `/stock/stockdet/${item.symbol}`;
                            suggestionsList.appendChild(li);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                });
        });
    </script>
</body>
</html>
