<!DOCTYPE html>
<html>
<head>
    <title>{{ symbol }} Dividend History</title>
    <style>
        table { border-collapse: collapse; width: 50%; margin: 2rem auto; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1 style="text-align:center;">{{ symbol }} - Dividend History</h1>
    <table>
        <tr>
            <th>Date</th>
            <th>Dividend</th>
        </tr>
        {% for date, value in dividends %}
        <tr>
            <td>{{ date }}</td>
            <td>{{ value }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="2">No dividend data available.</td></tr>
        {% endfor %}
    </table>

    <br>
    <a href="{% url 'stock_detail' symbol=symbol %}">Back to {{symbol}} Company Details</a>
</body>
</html>
