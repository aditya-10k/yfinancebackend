<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Latest News</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: url('https://plus.unsplash.com/premium_photo-1661963212517-830bbb7d76fc?q=80&w=2886&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      position: relative;
      color: #fff;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      z-index: 0;
    }

    h1 {
      position: relative;
      z-index: 1;
      font-size: 2rem;
      margin-bottom: 2rem;
      font-weight: 600;
    }

    .news-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
    }

    .news-card {
      width: 300px;
      border-radius: 1rem;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .news-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .news-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .news-card-content {
      padding: 1rem;
    }

    .news-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    .news-meta {
      font-size: 0.9rem;
      color: #ccc;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.5rem;
      }

      .news-card {
        width: 100%;
        max-width: 95%;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <h1>Latest News</h1>
  <div class="news-container">
    {% for news in news_items %}
      <a href="{{ news.link }}" target="_blank" class="news-card">
        {% if news.thumbnail.resolutions %}
          <img src="{{ news.thumbnail.resolutions.0.url }}" alt="Thumbnail">
        {% endif %}
        <div class="news-card-content">
          <div class="news-title">{{ news.title }}</div>
          <div class="news-meta">
            {{ news.publisher }} |
            {{ news.providerPublishTime|date:"M d, Y H:i" }}
          </div>
        </div>
      </a>
    {% endfor %}
  </div>
</body>
</html>
