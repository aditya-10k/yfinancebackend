<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ symbol }} - Stock Financials</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: url('https://plus.unsplash.com/premium_photo-1661963212517-830bbb7d76fc?q=80&w=2886&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem;
      position: relative;
      color: #fff;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1000px;
      background: rgba(255, 255, 255, 0.05);
      padding: 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(15px);
      overflow-x: auto;
    }

    h2 {
      font-size: 1.6rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      color: #fff;
    }

    th, td {
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.8rem;
      text-align: right;
    }

    th {
      background-color: rgba(255, 255, 255, 0.1);
      font-weight: 600;
      text-align: center;
    }

    td:first-child {
      text-align: left;
      font-weight: 500;
    }

    tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.05);
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 768px) {
      table {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <div class="container">
    <h2>{{ symbol }} - Stock Financial Data</h2>

    <table>
      <thead>
        <tr>
          <th>Metric</th>
          {% for year in years %}
            <th>{{ year }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody>
        {% for metric, values in financials_data.items %}
          <tr>
            <td>{{ metric }}</td>
            {% for value in values.values %}
              <td>{{ value|default:"N/A" }}</td>
            {% endfor %}
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</body>
</html>
