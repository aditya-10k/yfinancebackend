<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ symbol }} - Stock Financials</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f2f2f7;
      color: #111;
      padding: 2rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 1.5rem;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      overflow-x: auto;
    }

    h2 {
      font-size: 1.6rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 2rem;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.95rem;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px 8px;
      text-align: right;
    }

    th {
      background-color: #f9f9f9;
      font-weight: 600;
      text-align: center;
    }

    td:first-child {
      text-align: left;
      font-weight: 500;
    }

    tr:nth-child(even) {
      background-color: #fafafa;
    }

    tr:hover {
      background-color: #f2f2f2;
    }

    @media (max-width: 768px) {
      table {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>{{ symbol }} - Stock Financial Data</h2>

    <table>
      <thead>
        <tr>
          <th>Metric</th>
          {% for year in years %}
            <th>{{ year }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody>
        {% for metric, values in financials_data.items %}
          <tr>
            <td>{{ metric }}</td>
            {% for value in values.values %}
              <td>{{ value|default:"N/A" }}</td>
            {% endfor %}
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</body>
</html>
