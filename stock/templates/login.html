<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - StockVerse</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1651340981821-b519ad14da7c?q=80&w=2940&auto=format&fit=crop') no-repeat center center / cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 0;
    }

    .login-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.05);
      padding: 3rem 2rem;
      border-radius: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      color: white;
      width: 90%;
      max-width: 400px;
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
      font-weight: 600;
    }

    .login-card form {
      display: flex;
      flex-direction: column;
    }

    .login-card input {
      padding: 0.8rem 1rem;
      margin-bottom: 1.2rem;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      outline: none;
    }

    .login-card input::placeholder {
      color: #ccc;
    }

    .login-btn {
      background: white;
      color: black;
      padding: 0.75rem;
      border-radius: 9999px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .login-btn:hover {
      background: #e2e2e2;
      transform: scale(1.03);
    }

    .login-card .bottom-text {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }

    .login-card .bottom-text a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <div class="login-card">
    <h2>Login</h2>
    <form action="{% url 'login' %}" method="POST">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button class="login-btn" type="submit">Login</button>
    </form>
    <div class="bottom-text">
      Don't have an account? <a href="{% url 'register' %}">Sign up</a>
    </div>
  </div>

</body>
</html>
